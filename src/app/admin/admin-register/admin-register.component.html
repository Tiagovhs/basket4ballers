<div class="login-page">
  <div class="login-card">
    <div class="lock-icon">&#128275;</div>
    <h1 class="title">Créer un compte admin</h1>
    <p class="subtitle">Première configuration &mdash; accès unique</p>

    <div class="success-msg" *ngIf="success">
      Compte créé. Redirection vers la connexion...
    </div>

    <form class="form" (ngSubmit)="submit()" *ngIf="!success">
      <div class="field">
        <label class="label">Mot de passe</label>
        <input
          class="input"
          type="password"
          [(ngModel)]="password"
          name="password"
          (input)="onPasswordChange()"
          placeholder="••••••••"
          autocomplete="new-password"
        />
      </div>

      <div class="policy" *ngIf="showPolicy">
        <p class="policy-title">Politique de mot de passe</p>
        <ul class="policy-list">
          <li [class.ok]="policy.minLength">
            <span class="dot"></span> 8 caractères minimum
          </li>
          <li [class.ok]="policy.hasUppercase">
            <span class="dot"></span> Une majuscule
          </li>
          <li [class.ok]="policy.hasLowercase">
            <span class="dot"></span> Une minuscule
          </li>
          <li [class.ok]="policy.hasDigit">
            <span class="dot"></span> Un chiffre
          </li>
          <li [class.ok]="policy.hasSpecial">
            <span class="dot"></span> Un caractère spécial (!&#64;#$%...)
          </li>
        </ul>
      </div>

      <div class="field">
        <label class="label">Confirmer le mot de passe</label>
        <input
          class="input"
          [class.match]="passwordsMatch"
          [class.mismatch]="confirm.length > 0 && !passwordsMatch"
          type="password"
          [(ngModel)]="confirm"
          name="confirm"
          placeholder="••••••••"
          autocomplete="new-password"
        />
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button class="submit-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Création...' : 'Créer le compte' }}
      </button>
    </form>

    <p class="register-link" *ngIf="!success">
      Déjà un compte ? <a routerLink="/admin/login">Se connecter</a>
    </p>
  </div>
</div>
